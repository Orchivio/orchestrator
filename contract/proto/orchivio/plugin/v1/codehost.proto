syntax = "proto3";

package orchivio.plugin.v1;

import "google/protobuf/timestamp.proto";
import "orchivio/plugin/v1/common.proto";

option go_package = "github.com/orchivio/orchestrator/contract/gen/orchivio/plugin/v1;pluginv1";

service CodeHostAdapter {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);
  rpc IssueRepoCredentials(IssueRepoCredentialsRequest) returns (RepoCredentials);
  rpc StreamEvents(StreamCodeHostEventsRequest) returns (stream CodeHostEvent);
  rpc RevokeRepoCredentials(RevokeRepoCredentialsRequest) returns (RevokeRepoCredentialsResponse);
  rpc OpenPullRequest(OpenPullRequestRequest) returns (PullRequest);
  rpc BeginConnect(BeginConnectRequest) returns (BeginConnectResponse);
  rpc CompleteConnect(CompleteConnectRequest) returns (CompleteConnectResponse);
  rpc RefreshCredential(RefreshCredentialRequest) returns (Credential);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
}

message IssueRepoCredentialsRequest {
  repeated string repos = 1; // "owner/name"
  bool write = 2;
  repeated Credential credentials = 3;
}

message RepoCredentials {
  string username = 1;
  string token = 2;
  google.protobuf.Timestamp expires_at = 3;
  map<string, string> clone_urls = 4; // repo -> https URL without credentials
  map<string, RepoToken> tokens = 5; // repo -> token; empty = single token above applies
  string credential_id = 6; // what the adapter needs to revoke
}

message RepoToken {
  string username = 1;
  string token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message OpenPullRequestRequest {
  string repo = 1;
  string base = 2;
  string head = 3;
  string title = 4;
  string body = 5;
  repeated Credential credentials = 6;
}

message PullRequest {
  string url = 1;
  int64 number = 2;
}

message StreamCodeHostEventsRequest {
  repeated string repos = 1; // full paths
  repeated Credential credentials = 2;
}

message CodeHostEvent {
  string external_id = 1; // dedup key
  enum Kind {
    KIND_UNSPECIFIED = 0;
    REVIEW_COMMENTED = 1;
  }
  Kind kind = 2;
  string repo = 3;   // full path, e.g. "group/sub/project"
  string branch = 4; // source branch of the PR/MR
  string pr_url = 5;
  Actor actor = 6;
  string body = 7; // Markdown
  bool mentions_bot = 8;
}

message RevokeRepoCredentialsRequest {
  string credential_id = 1;
  repeated Credential credentials = 2;
}

message RevokeRepoCredentialsResponse {}
