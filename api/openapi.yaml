openapi: 3.1.0
info:
  title: Orchivio Admin API
  version: 1.0.0
  description: >
    Runtime administration of tenants, profiles, projects, connections and API tokens.
    Every single-resource response carries ETag "<version>"; PUT and DELETE
    honour If-Match "<version>" (absent means last writer wins).
    Errors are RFC 9457 problem details.
    Instance admin tokens may do everything. A tenant admin token sees only its
    own tenant (any other tenant in the path is 404), manages that tenant's
    profiles, projects, connections and tenant tokens, may change only the
    tenant's displayName, and gets 403 for instance-only actions.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /tenants:
    get:
      summary: List tenants
      operationId: listTenants
      responses:
        "200": {description: Tenants, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Tenant"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Create a tenant
      operationId: createTenant
      requestBody: {$ref: "#/components/requestBodies/Tenant"}
      responses:
        "201": {$ref: "#/components/responses/TenantCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{slug}:
    parameters: [{$ref: "#/components/parameters/Slug"}]
    get:
      summary: Get a tenant
      operationId: getTenant
      responses:
        "200": {$ref: "#/components/responses/TenantOK"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Replace a tenant
      operationId: putTenant
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/TenantUpdate"}
      responses:
        "200": {$ref: "#/components/responses/TenantOK"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Delete a tenant (soft)
      operationId: deleteTenant
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
  /tenants/{slug}/profiles:
    parameters: [{$ref: "#/components/parameters/Slug"}]
    get:
      summary: List profiles of a tenant
      operationId: listProfiles
      responses:
        "200": {description: Profiles, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Profile"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Create a profile
      operationId: createProfile
      requestBody: {$ref: "#/components/requestBodies/Profile"}
      responses:
        "201": {$ref: "#/components/responses/ProfileCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{slug}/profiles/{id}:
    parameters: [{$ref: "#/components/parameters/Slug"}, {$ref: "#/components/parameters/Id"}]
    get:
      summary: Get a profile
      operationId: getProfile
      responses:
        "200": {$ref: "#/components/responses/ProfileOK"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Replace a profile
      operationId: putProfile
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/Profile"}
      responses:
        "200": {$ref: "#/components/responses/ProfileOK"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Delete a profile (soft; 409 while a project uses it)
      operationId: deleteProfile
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
  /tenants/{slug}/projects:
    parameters: [{$ref: "#/components/parameters/Slug"}]
    get:
      summary: List projects of a tenant
      operationId: listProjects
      responses:
        "200": {description: Projects, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Project"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Create a project
      operationId: createProject
      requestBody: {$ref: "#/components/requestBodies/Project"}
      responses:
        "201": {$ref: "#/components/responses/ProjectCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{slug}/projects/{id}:
    parameters: [{$ref: "#/components/parameters/Slug"}, {$ref: "#/components/parameters/Id"}]
    get:
      summary: Get a project
      operationId: getProject
      responses:
        "200": {$ref: "#/components/responses/ProjectOK"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Replace a project
      operationId: putProject
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody: {$ref: "#/components/requestBodies/Project"}
      responses:
        "200": {$ref: "#/components/responses/ProjectOK"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Delete a project (soft; 409 while runs are unfinished)
      operationId: deleteProject
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
  /tenants/{slug}/projects/{id}/runs:
    parameters: [{$ref: "#/components/parameters/Slug"}, {$ref: "#/components/parameters/Id"}]
    get:
      summary: List a project's runs, newest first
      operationId: listRuns
      parameters:
        - {name: ticket, in: query, required: false, schema: {type: string}, description: Only runs for this ticket}
        - {name: state, in: query, required: false, schema: {type: string}, description: Only runs in this state}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before, in: query, required: false, schema: {type: string}, description: Opaque cursor, the next value of the previous page}
      responses:
        "200": {$ref: "#/components/responses/RunListOK"}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tenants/{slug}/projects/{id}/runs/{runId}:
    parameters:
      - {$ref: "#/components/parameters/Slug"}
      - {$ref: "#/components/parameters/Id"}
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a run with its events
      operationId: getRun
      responses:
        "200": {$ref: "#/components/responses/RunOK"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tenants/{slug}/connections:
    parameters: [{$ref: "#/components/parameters/Slug"}]
    get:
      summary: List connections of a tenant (never includes credentials)
      operationId: listConnections
      responses:
        "200": {description: Connections, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Connection"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /tenants/{slug}/connections/{adapter}/authorize:
    parameters:
      - {$ref: "#/components/parameters/Slug"}
      - {name: adapter, in: path, required: true, schema: {type: string}, description: The tenant's trackerAdapter or codeHostAdapter}
    post:
      summary: Start connecting the tenant to an adapter
      description: >
        Returns the provider URL to open in a browser. The provider redirects to
        {ORCHIVIO_PUBLIC_URL}/oauth/callback/{adapter}, which stores the
        connection and shows a plain HTML page; that page needs no token, its
        single-use state (valid 10 minutes) authorizes it.
      operationId: authorizeConnection
      responses:
        "200":
          description: Provider URL
          content:
            application/json:
              schema: {type: object, required: [url], properties: {url: {type: string, format: uri}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
        "502": {$ref: "#/components/responses/AdapterFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /tenants/{slug}/connections/{adapter}/form:
    parameters:
      - {$ref: "#/components/parameters/Slug"}
      - {name: adapter, in: path, required: true, schema: {type: string}}
    get:
      summary: The form to connect the tenant to an adapter without OAuth
      description: 404 if the adapter connects only through OAuth.
      operationId: getConnectForm
      responses:
        "200":
          description: Form fields
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items:
                      type: object
                      required: [name, label, secret, required]
                      properties:
                        name: {type: string}
                        label: {type: string}
                        secret: {type: boolean, description: Render as a password input; never echoed}
                        required: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/AdapterFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      summary: Connect the tenant to an adapter with form values
      description: >
        Fields are those of the form. A missing required field or values the
        adapter refuses give 422 (field fields.<name> or fields). Values are
        never echoed or logged. A connection to the same account is replaced
        in place (200); a new one is created (201, with Location).
      operationId: connectByForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields: {type: object, additionalProperties: {type: string}}
      responses:
        "200": {description: Existing connection of the same account replaced, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "201": {description: Connection created, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
        "502": {$ref: "#/components/responses/AdapterFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /tenants/{slug}/connections/{id}:
    parameters: [{$ref: "#/components/parameters/Slug"}, {$ref: "#/components/parameters/Id"}]
    get:
      summary: Get a connection
      operationId: getConnection
      responses:
        "200": {description: Connection, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      summary: Disconnect (soft delete; the adapter revokes at the provider on a best-effort basis)
      operationId: deleteConnection
      responses:
        "204": {description: Disconnected}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /tokens:
    get:
      summary: List API tokens (never includes plaintext); a tenant admin sees only its tenant's tokens
      operationId: listTokens
      responses:
        "200": {description: Tokens, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Token"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Issue an admin token; the plaintext is shown only in this response
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
                expiresIn: {type: string, examples: ["720h"], description: Go duration; default 90 days}
                tenant:
                  type: string
                  description: >
                    Tenant slug for a tenant admin token. Omitted by an instance admin: instance token.
                    A tenant admin may only name its own tenant (omitted means its own).
      responses:
        "201": {description: Token issued, content: {application/json: {schema: {$ref: "#/components/schemas/TokenCreated"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tokens/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    delete:
      summary: Revoke a token (a tenant admin only its tenant's tokens; others are 404)
      operationId: revokeToken
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Slug: {name: slug, in: path, required: true, schema: {type: string}}
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string, examples: ['"3"']}
      description: Expected version; mismatch yields 412, absent means last writer wins.
  headers:
    ETag: {schema: {type: string, examples: ['"1"']}}
  requestBodies:
    Tenant: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
    TenantUpdate: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TenantUpdate"}}}}
    Profile: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Profile"}}}}
    Project: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
  responses:
    TenantOK: {description: Tenant, headers: {ETag: {$ref: "#/components/headers/ETag"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
    TenantCreated: {description: Created, headers: {ETag: {$ref: "#/components/headers/ETag"}, Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
    ProfileOK: {description: Profile, headers: {ETag: {$ref: "#/components/headers/ETag"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Profile"}}}}
    ProfileCreated: {description: Created, headers: {ETag: {$ref: "#/components/headers/ETag"}, Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Profile"}}}}
    ProjectOK: {description: Project, headers: {ETag: {$ref: "#/components/headers/ETag"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
    ProjectCreated: {description: Created, headers: {ETag: {$ref: "#/components/headers/ETag"}, Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
    RunListOK: {description: Runs, content: {application/json: {schema: {type: object, required: [runs], properties: {runs: {type: array, items: {$ref: "#/components/schemas/Run"}}, next: {type: string, description: Present only when more runs follow}}}}}}
    RunOK: {description: Run, content: {application/json: {schema: {type: object, required: [run, events], properties: {run: {$ref: "#/components/schemas/Run"}, events: {type: array, items: {$ref: "#/components/schemas/RunEvent"}}}}}}}
    BadRequest: {description: Malformed JSON, unknown field, bad If-Match or bad query parameter, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Unauthorized: {description: Missing, invalid, expired or revoked token, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Forbidden: {description: The token may see the resource but not perform this action, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    NotFound: {description: Resource does not exist, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Conflict: {description: Resource still in use, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    PreconditionFailed: {description: If-Match version is stale, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    AdapterFailed: {description: The adapter rejected or failed the request, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Unavailable: {description: Connections not configured or adapter unreachable, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Invalid: {description: Validation failed, content: {application/problem+json: {schema: {$ref: "#/components/schemas/ValidationProblem"}}}}
  schemas:
    Run:
      type: object
      properties:
        id: {type: string, format: uuid}
        tenant: {type: string}
        ticketRef: {type: string}
        kind: {type: string}
        state: {type: string}
        repos: {type: array, items: {type: string}}
        branch: {type: string}
        result: {type: string}
        prUrls: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RunEvent:
      type: object
      properties:
        type: {type: string}
        payload: {}
        at: {type: string, format: date-time}
    Tenant:
      type: object
      additionalProperties: false
      required: [slug, displayName, trackerAdapter, codeHostAdapter]
      properties:
        slug: {type: string, description: Ignored on PUT; the path wins}
        displayName: {type: string}
        trackerAdapter: {type: string, description: Immutable}
        codeHostAdapter: {type: string}
        version: {type: integer, format: int64, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    TenantUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        slug: {type: string, description: Optional and ignored; the path wins}
        displayName: {type: string}
        trackerAdapter: {type: string, description: "Immutable. Required for instance admins; a tenant admin may omit it (the stored value is kept), another value is 403"}
        codeHostAdapter: {type: string, description: "Required for instance admins; a tenant admin may omit it (the stored value is kept), another value is 403"}
    Profile:
      type: object
      additionalProperties: false
      required: [name, runtime, maxDuration]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string}
        runtime: {type: string}
        model: {type: string}
        instructions: {type: string}
        maxDuration: {type: string, examples: ["20m"], description: Go duration}
        version: {type: integer, format: int64, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    Repo:
      type: object
      additionalProperties: false
      properties:
        slug: {type: string, examples: [owner/name]}
        baseBranch: {type: string}
        allowedPaths: {type: array, items: {type: string}, description: Path prefixes; empty string allows everything}
        users: {type: array, items: {type: string}}
    ClassifierRules:
      type: object
      additionalProperties: false
      properties:
        taskLabels: {type: array, items: {type: string}}
        questionLabels: {type: array, items: {type: string}}
        repoLabels: {type: object, additionalProperties: {type: string}}
        defaultRepo: {type: string}
    Roles:
      type: object
      additionalProperties: false
      properties:
        questions: {type: array, items: {type: string}, description: E-mail addresses}
        tasks: {type: array, items: {type: string}, description: E-mail addresses}
    Project:
      type: object
      additionalProperties: false
      required: [name, trackerKey, profileId]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string}
        trackerKey: {type: string, description: Immutable}
        profileId: {type: string, format: uuid}
        repos: {type: array, items: {$ref: "#/components/schemas/Repo"}}
        classifier: {$ref: "#/components/schemas/ClassifierRules"}
        roles: {$ref: "#/components/schemas/Roles"}
        maxDiffLines: {type: integer}
        milestones: {type: array, items: {type: string}}
        version: {type: integer, format: int64, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    Connection:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [tracker, codehost]}
        adapter: {type: string}
        label: {type: string, description: Set by the adapter, e.g. workspace name or GitHub login}
        status: {type: string, enum: [active, needs_reauth]}
        createdAt: {type: string, format: date-time}
    Token:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
        scope: {type: string, enum: [instance, tenant]}
        tenant: {type: string, description: Tenant slug; only for scope tenant}
        role: {type: string, enum: [admin]}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: [string, "null"], format: date-time}
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Plaintext, returned only once}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string, examples: [classifier.defaultRepo]}
                  message: {type: string}
