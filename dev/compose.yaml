# Orchivio dev stack. Uses only published images from ghcr.io; nothing is
# built locally. ORCHIVIO_VERSION picks the image tag (main or a release).
# run-all.sh sets ORCHIVIO_PODMAN_SOCKET and ORCHIVIO_WORK_DIR.
name: orchivio

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: orchivio
      POSTGRES_PASSWORD: orchivio
      POSTGRES_DB: orchivio
    volumes:
      - orchivio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orchivio"]
      interval: 2s
      retries: 15

  orchestrator:
    image: ghcr.io/orchivio/orchestrator:${ORCHIVIO_VERSION:-main}
    environment:
      DATABASE_URL: postgres://orchivio:orchivio@postgres:5432/orchivio?sslmode=disable
      ORCHIVIO_ADAPTERS: ${ORCHIVIO_ADAPTERS:-linear=adapter-linear:7101,github=adapter-github:7201}${ORCHIVIO_EXTRA_ADAPTERS:-}
      ORCHIVIO_BOOTSTRAP_TOKEN: ${ORCHIVIO_BOOTSTRAP_TOKEN:-}
      ORCHIVIO_SECRET_KEY: ${ORCHIVIO_SECRET_KEY}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7070
      ORCHIVIO_HTTP_ADDR: 0.0.0.0:8088
      ORCHIVIO_PUBLIC_URL: http://localhost:8088
    ports:
      - "127.0.0.1:8088:8088" # admin API incl. runs (plain HTTP, localhost only); gRPC stays inside the stack
    # Adapters are dialed lazily, so they are not dependencies.
    depends_on:
      postgres: { condition: service_healthy }

  # Profile linear-github (run-all.sh default when COMPOSE_PROFILES is unset).

  adapter-linear:
    image: ghcr.io/orchivio/adapter-linear:${ORCHIVIO_VERSION:-main}
    profiles: [linear-github]
    environment:
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_CLIENT_SECRET_REF: ${LINEAR_CLIENT_SECRET_REF:-}
      LINEAR_POLL_INTERVAL: ${LINEAR_POLL_INTERVAL:-10s}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7101

  adapter-github:
    image: ghcr.io/orchivio/adapter-github:${ORCHIVIO_VERSION:-main}
    profiles: [linear-github]
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_PRIVATE_KEY_REF: ${GITHUB_APP_PRIVATE_KEY_REF}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CLIENT_SECRET_REF: ${GITHUB_CLIENT_SECRET_REF}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7201

  # Profile jira-gitlab (COMPOSE_PROFILES=jira-gitlab): the orchestrator learns
  # these adapters through ORCHIVIO_ADAPTERS or ORCHIVIO_EXTRA_ADAPTERS (README).
  # ORCHIVIO_CA_FILE (host PEM bundle, corporate CA + system CAs) is mounted at
  # /etc/orchivio/ca.pem and wins over the image's roots; unset, /dev/null is
  # mounted and SSL_CERT_FILE stays empty.
  adapter-jira-cloud:
    image: ghcr.io/orchivio/adapter-jira:${ORCHIVIO_VERSION:-main}
    profiles: [jira-gitlab]
    environment:
      JIRA_DEPLOYMENT: cloud
      JIRA_POLL_INTERVAL: ${JIRA_POLL_INTERVAL:-30s}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7301
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SSL_CERT_FILE: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
      SSL_CERT_DIR: ${SSL_CERT_DIR:-}
    volumes:
      - ${ORCHIVIO_CA_FILE:-/dev/null}:/etc/orchivio/ca.pem:ro

  adapter-jira-dc:
    image: ghcr.io/orchivio/adapter-jira:${ORCHIVIO_VERSION:-main}
    profiles: [jira-gitlab]
    environment:
      JIRA_DEPLOYMENT: datacenter
      JIRA_URL: ${JIRA_URL:-}
      JIRA_POLL_INTERVAL: ${JIRA_POLL_INTERVAL:-30s}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7302
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SSL_CERT_FILE: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
      SSL_CERT_DIR: ${SSL_CERT_DIR:-}
    volumes:
      - ${ORCHIVIO_CA_FILE:-/dev/null}:/etc/orchivio/ca.pem:ro

  adapter-gitlab:
    image: ghcr.io/orchivio/adapter-gitlab:${ORCHIVIO_VERSION:-main}
    profiles: [jira-gitlab]
    environment:
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_POLL_INTERVAL: ${GITLAB_POLL_INTERVAL:-30s}
      ORCHIVIO_GRPC_ADDR: 0.0.0.0:7401
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SSL_CERT_FILE: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
      SSL_CERT_DIR: ${SSL_CERT_DIR:-}
    volumes:
      - ${ORCHIVIO_CA_FILE:-/dev/null}:/etc/orchivio/ca.pem:ro

  # Local Jira Data Center for testing (profile local-jira). Set
  # JIRA_URL=http://jira-dc:8080 so adapter-jira-dc reaches it on the compose
  # network; the browser uses http://localhost:${JIRA_LOCAL_PORT:-8089}.
  # Data (setup, users, license) survives restarts in the jira-data volume.
  # GitLab CE is not included (large image); point GITLAB_URL at an instance.
  jira-dc:
    image: ${JIRA_IMAGE:-atlassian/jira-software:11}
    profiles: [local-jira]
    environment:
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: ${JIRA_JVM_MAX:-2048m}
      ATL_TOMCAT_PORT: "8080"
    ports:
      - "127.0.0.1:${JIRA_LOCAL_PORT:-8089}:8080"
    volumes:
      - jira-data:/var/atlassian/application-data/jira

  # Credential/egress proxy: the only container on orchivio-sandbox with a way out.
  proxy:
    image: ghcr.io/orchivio/worker-podman:${ORCHIVIO_VERSION:-main}
    container_name: orchivio-proxy
    command: ["proxy"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Upstream calls honour HTTPS_PROXY; CONNECT tunnels dial directly.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SSL_CERT_FILE: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
    volumes:
      - ${ORCHIVIO_CA_FILE:-/dev/null}:/etc/orchivio/ca.pem:ro
    networks: [sandbox, egress]

  # Starts sandbox containers through the podman socket. Work dir has the same
  # path in this container and in the podman VM so sandbox mounts resolve.
  worker:
    image: ghcr.io/orchivio/worker-podman:${ORCHIVIO_VERSION:-main}
    command: ["run"]
    environment:
      ORCHIVIO_SERVER_ADDR: orchestrator:7070
      ORCHIVIO_WORKER_ID: local-1
      ORCHIVIO_WORK_DIR: ${ORCHIVIO_WORK_DIR}
      ORCHIVIO_SANDBOX_IMAGE: ghcr.io/orchivio/adapter-claude-code:${ORCHIVIO_VERSION:-main}
      ORCHIVIO_PROXY_URL: http://orchivio-proxy:8090
      # Host git (clone, push): libcurl reads the lowercase variants. The
      # stack's own names bypass the proxy (gRPC to the orchestrator).
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: orchestrator,orchivio-proxy,${NO_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      no_proxy: orchestrator,orchivio-proxy,${NO_PROXY:-}
      SSL_CERT_FILE: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
      GIT_SSL_CAINFO: ${ORCHIVIO_CA_FILE:+/etc/orchivio/ca.pem}
    volumes:
      - ${ORCHIVIO_PODMAN_SOCKET}:/run/podman/podman.sock
      - ${ORCHIVIO_WORK_DIR}:${ORCHIVIO_WORK_DIR}
      - ${ORCHIVIO_CA_FILE:-/dev/null}:/etc/orchivio/ca.pem:ro
    security_opt: ["label=disable"] # socket access under SELinux in the podman VM
    depends_on: [orchestrator, proxy]

networks:
  sandbox:
    name: orchivio-sandbox
    internal: true
  egress:
    name: orchivio-egress

volumes:
  orchivio-pgdata:
  jira-data:
