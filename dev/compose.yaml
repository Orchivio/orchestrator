services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: orchivio
      POSTGRES_PASSWORD: orchivio
      POSTGRES_DB: orchivio
    ports:
      - "5432:5432"
    volumes:
      - orchivio-pgdata:/var/lib/postgresql/data

volumes:
  orchivio-pgdata:
